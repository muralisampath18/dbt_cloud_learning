models:
 - name: raw_products
   columns:
    - name: category
      tests: 
       - accepted_values:
           arguments: # available in v1.10.5 and higher. Older versions can set the <argument_name> as the top-level property.
                values: ["Doohickey", "Widget", "Gizmo", "Gadget"]
    - name: id
      tests:
        - relationships:
            arguments: 
              to: ref('raw_orders')
              field: product_id
            config: 
              severity: warn