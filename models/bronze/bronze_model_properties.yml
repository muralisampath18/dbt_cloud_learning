version: 2

models:
  - name: raw_products
    columns:
      - name: category
        tests:
          - accepted_values:
              arguments:
                values: ["Doohickey", "Widget", "Gizmo", "Gadget"]
      - name: id
        tests:
          - relationships:
              arguments: 
                to: ref('raw_orders')
                field: product_id
              config:
                severity: warn

  - name: raw_orders
    tests:
      - dbt_expectations.expect_table_columns_to_contain_set:
          arguments: 
            column_list: ["id", "users_ID"]
          config: 
            severity: warn
    columns:
      - name: quantity
        tests:
          - dbt_utils.expression_is_true:
              arguments: 
                expression: ">-1"
            
